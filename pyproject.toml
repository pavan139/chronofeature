[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gunamilan"
version = "0.3.0"
description = "Multilingual Vedic compatibility and birth charts"
requires-python = ">=3.11"
dependencies = [
  "pyswisseph>=2.10.3,<3", "fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3", "jinja2>=3.1.4,<4", "tzdata>=2024.1", "weasyprint==70.0", "pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.48,<2", "pypdf>=6,<7", "pymupdf>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["gunamilan*"]

[tool.setuptools.package-data]
gunamilan = ["templates/*.html", "static/*", "locales/*.json", "data/*.db"]

[tool.pytest.ini_options]
testpaths = ["gunamilan", "tests"]
