[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronofeature"
version = "0.1.0"
description = "Bitemporal point-in-time window features and immutable online materialization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chronofeature = "chronofeature.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
