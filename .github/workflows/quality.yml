name: Application quality
on:
  push:
    branches: [main, feat/multilingual-frontend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: pip install -e '.[test]'
      - name: Cache offline places
        uses: actions/cache@v4
        with:
          path: gunamilan/data/places.db
          key: geonames-multiscript-v1
      - name: Build places when absent
        run: |
          if [ ! -f gunamilan/data/places.db ]; then
            python scripts/fetch_places.py
          fi
      - name: Engine and HTTP tests
        run: python -m pytest -q
      - name: Verify container build
        run: |
          docker build -t astro-ci .
          docker run --rm astro-ci python -c "from gunamilan.api import app; from gunamilan.ephemeris import BirthData, cast_chart; import datetime as d; print(cast_chart(BirthData('CI',d.date(2000,1,1),d.time(12),17.385,78.4867)).moon.rashi_name)"
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Install script fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-extra
      - name: Browser integration and screenshots
        run: |
          uvicorn gunamilan.api:app --host 127.0.0.1 --port 8000 > /tmp/astro-server.log 2>&1 &
          python -c "import urllib.request,time; [(time.sleep(1)) for _ in range(3)]; urllib.request.urlopen('http://127.0.0.1:8000/health')"
          python tests/browser_ui.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure page quality on an indexable local instance
        run: |
          INDEXABLE=true INDEX_LOCALES=en SITE_URL=http://127.0.0.1:8001 uvicorn gunamilan.api:app --host 127.0.0.1 --port 8001 > /tmp/astro-audit.log 2>&1 &
          python -c "import time; time.sleep(2)"
          npx --yes lighthouse@13.4.1 http://127.0.0.1:8001/en/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=test-results/lighthouse.json --quiet
          python - <<'PY'
          import json
          report = json.load(open("test-results/lighthouse.json"))
          scores = {name: int(value["score"] * 100) for name, value in report["categories"].items()}
          print("ASTRO_LIGHTHOUSE=" + json.dumps(scores))
          for key in ["largest-contentful-paint", "cumulative-layout-shift", "total-blocking-time"]:
              print(key + ": " + report["audits"][key]["displayValue"])
          failed = [{"id": k, "title": v["title"], "description": v.get("description", "")}
                    for k, v in report["audits"].items() if v.get("score") == 0]
          print("ASTRO_AUDIT_FAILURES=" + json.dumps(failed))
          assert scores["performance"] >= 90 and scores["accessibility"] >= 90 and scores["seo"] >= 90, scores
          PY
      - name: Screenshot preview
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ["desktop.png", "mobile-ta.png", "mobile-ur.png"]:
              p = Path("test-results") / name
              if p.exists():
                  print("ASTRO_IMAGE_" + name + "=" + base64.b64encode(p.read_bytes()).decode())
          PY
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-review
          path: test-results/
          if-no-files-found: ignore
