name: Application quality
on:
  push:
    branches: [main, feat/multilingual-frontend]
  workflow_dispatch:
concurrency:
  group: application-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: pip install -e '.[test]'
      - name: Install PDF renderer and script fonts
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core fonts-noto-extra
      - name: Cache offline places
        uses: actions/cache@v4
        with:
          path: gunamilan/data/places.db
          key: geonames-multiscript-v1
      - name: Build places when absent
        run: |
          if [ ! -f gunamilan/data/places.db ]; then
            python scripts/fetch_places.py
          fi
      - name: Engine and HTTP tests
        run: python -m pytest -q
      - name: Verify container build
        run: |
          docker build -t astro-ci .
          docker run --rm astro-ci python -c "from gunamilan.api import app; from gunamilan.ephemeris import BirthData, cast_chart; import datetime as d; print(cast_chart(BirthData('CI',d.date(2000,1,1),d.time(12),17.385,78.4867)).moon.rashi_name)"
          docker run --rm astro-ci python -c "from gunamilan.api import BirthInput, chart_pdf; b=BirthInput(name='CI',date='2000-01-01',time='12:00',latitude=17.385,longitude=78.4867); r=chart_pdf(b,locale='ta'); assert r.body.startswith(b'%PDF-'); print('Container PDF bytes:',len(r.body))"
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Browser integration and screenshots
        run: |
          uvicorn gunamilan.api:app --host 127.0.0.1 --port 8000 > /tmp/astro-server.log 2>&1 &
          python -c "import urllib.request,time; [(time.sleep(1)) for _ in range(3)]; urllib.request.urlopen('http://127.0.0.1:8000/health')"
          python tests/browser_ui.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure page quality on an indexable local instance
        run: |
          INDEXABLE=true INDEX_LOCALES=en SITE_URL=http://127.0.0.1:8001 uvicorn gunamilan.api:app --host 127.0.0.1 --port 8001 > /tmp/astro-audit.log 2>&1 &
          python -c "import time; time.sleep(2)"
          for audit in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:8001/en/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="test-results/lighthouse-$audit.json" --quiet
          done
          python scripts/check_lighthouse.py
      - name: Screenshot preview
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ["report-tools.png", "pdf-en.png", "pdf-ta.png", "pdf-ur.png", "pdf-sat.png", "pdf-en-last.png", "pdf-match-1.png"]:
              p = Path("test-results") / name
              if p.exists():
                  print("ASTRO_IMAGE_" + name + "=" + base64.b64encode(p.read_bytes()).decode())
          PY
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-review
          path: test-results/
          if-no-files-found: ignore
